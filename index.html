<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Habits">
<meta name="theme-color" content="#121212">
<title>Habits</title>
<link rel="apple-touch-icon" id="icon" href="">
<style>
:root{--bg:#121212;--bar:#171717;--row:#2b2b2b;--text:#e8e8e8;--dim:#8a8a8a;--cell:50px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:16px -apple-system,BlinkMacSystemFont,"Roboto",sans-serif}
body{padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom);display:flex;flex-direction:column}
header{display:flex;align-items:center;background:var(--bar);padding:10px 8px 10px 16px;gap:4px}
header h1{flex:1;margin:0;font-size:24px;font-weight:600}
.ib{background:none;border:0;color:var(--text);font-size:26px;width:44px;height:44px;border-radius:50%}
.ib:active{background:#333}
main{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
.head,.row{display:grid;grid-template-columns:1fr repeat(5,var(--cell));align-items:center}
.head{padding:12px 6px 10px 0;color:var(--dim);font-size:13px;text-align:center;line-height:1.3;font-weight:600}
.head b{display:block;font-size:16px;font-weight:500}
.head.today b{color:var(--text)}
.row{background:var(--row);margin:0 4px 5px;padding:0 2px 0 0;min-height:62px;border-radius:2px}
.name{display:flex;align-items:center;gap:10px;padding:10px 6px 10px 12px;font-size:18px;min-width:0}
.name span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cell{height:62px;display:flex;flex-direction:column;align-items:center;justify-content:center;border:0;background:none;color:var(--dim);font:inherit}
.cell .x{font-size:22px;color:#6b6b6b}
.cell .ck{font-size:26px;font-weight:700}
.cell .n{font-size:20px;font-weight:600;line-height:1}
.cell .u{font-size:14px;font-weight:400;color:var(--dim)}
.cell.z{opacity:.5}
.empty{padding:40px 24px;text-align:center;color:var(--dim);line-height:1.5}
.dim{opacity:.35}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:flex-end;z-index:5}
.scrim.on{display:flex}
.sheet{background:#232323;width:100%;border-radius:16px 16px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom));max-height:88%;overflow-y:auto;-webkit-user-select:text;user-select:text}
.sheet h2{margin:0 0 14px;font-size:20px}
label{display:block;font-size:13px;color:var(--dim);margin:12px 0 4px}
input,select,textarea{width:100%;background:#151515;color:var(--text);border:1px solid #3a3a3a;border-radius:8px;padding:11px;font:inherit;font-size:17px}
textarea{height:140px;font-size:12px;font-family:ui-monospace,monospace}
.sw{display:flex;gap:10px;flex-wrap:wrap;margin-top:4px}
.sw i{width:34px;height:34px;border-radius:50%;border:3px solid transparent}
.sw i.sel{border-color:#fff}
.btns{display:flex;gap:10px;margin-top:18px}
.btn{flex:1;padding:13px;border-radius:10px;border:0;background:#3a3a3a;color:var(--text);font:inherit;font-weight:600}
.btn.p{background:#4aa3ff;color:#001}
.btn.d{background:none;color:#ff6b6b;flex:0 0 auto}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;text-align:center;margin-bottom:6px}
.stats b{display:block;font-size:22px}
.stats small{color:var(--dim);font-size:12px}
.fields{display:flex;gap:10px}
.fields>div{flex:1}
</style>
</head>
<body>
<header>
  <h1>Habits</h1>
  <button class="ib" id="prev" aria-label="Earlier days">&#8249;</button>
  <button class="ib" id="next" aria-label="Later days">&#8250;</button>
  <button class="ib" id="add" aria-label="Add habit">+</button>
  <button class="ib" id="more" aria-label="Backup">&#8942;</button>
</header>
<main id="main"></main>
<div class="scrim" id="scrim"><div class="sheet" id="sheet"></div></div>

<script>
const COLORS=['#4aa3ff','#f77fa6','#ffc268','#b793ea','#5ed6a0','#ff7a6b','#6fd6e8','#c9d65a'];
const KEY='habits-v1';
let S;try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){}
if(!S||!S.h){S={h:[],e:{}}}
let offset=0;
const $=id=>document.getElementById(id);
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const dk=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const pd=k=>{const[a,b,c]=k.split('-').map(Number);return new Date(a,b-1,c)};
const val=(h,k)=>(S.e[h.id]||{})[k]||0;
const done=(h,k)=>{const v=val(h,k);return h.type==='num'?v>=(h.target||1):v>0};
const fmt=n=>Math.round(n*100)/100;

function score(h){ // Loop-style habit strength: exponential smoothing of daily completions
  const m=Math.pow(0.5,Math.sqrt(1)/13);let s=0;
  const end=new Date();end.setHours(0,0,0,0);
  for(let d=pd(h.created);d<=end;d.setDate(d.getDate()+1)){s=s*m+(done(h,dk(d))?1:0)*(1-m)}
  return s;
}
function streaks(h){
  const end=new Date();end.setHours(0,0,0,0);
  let cur=0,best=0,run=0,total=0;
  for(let d=pd(h.created);d<=end;d.setDate(d.getDate()+1)){
    if(done(h,dk(d))){run++;total++;best=Math.max(best,run)}else run=0;
  }
  const d=new Date(end);if(!done(h,dk(d)))d.setDate(d.getDate()-1);
  while(done(h,dk(d))){cur++;d.setDate(d.getDate()-1)}
  return{cur,best,total};
}
function ring(c,p){
  const r=9,L=2*Math.PI*r;
  return `<svg width="26" height="26" viewBox="0 0 26 26" style="flex:none;transform:rotate(-90deg)"><circle cx="13" cy="13" r="${r}" fill="none" stroke="#444" stroke-width="4"/><circle cx="13" cy="13" r="${r}" fill="none" stroke="${c}" stroke-width="4" stroke-linecap="round" stroke-dasharray="${L*Math.max(p,.02)} ${L}"/></svg>`;
}
function days(){
  const a=[];for(let i=0;i<5;i++){const d=new Date();d.setHours(0,0,0,0);d.setDate(d.getDate()-offset*5-i);a.push(d)}return a;
}
function render(){
  const D=days(),T=dk(new Date());
  const dn=['SUN','MON','TUE','WED','THU','FRI','SAT'];
  let html=`<div class="head"><span></span>${D.map(d=>`<div class="${dk(d)===T?'today':''}">${dn[d.getDay()]}<b>${d.getDate()}</b></div>`).join('')}</div>`;
  if(!S.h.length)html+=`<div class="empty">No habits yet.<br>Tap + to add your first one.</div>`;
  S.h.forEach(h=>{
    html+=`<div class="row" style="color:${h.color}"><div class="name" data-edit="${h.id}">${ring(h.color,score(h))}<span>${esc(h.name)}</span></div>`;
    D.forEach(d=>{
      const k=dk(d),v=val(h,k),ok=done(h,k);
      if(h.type==='num')html+=`<button class="cell ${v?'':'z'}" data-cell="${h.id}|${k}"><span class="n" style="color:${ok?h.color:'var(--text)'}">${fmt(v)}</span><span class="u">${esc(h.unit||'')}</span></button>`;
      else html+=`<button class="cell" data-cell="${h.id}|${k}">${ok?'<span class="ck">&#10003;</span>':'<span class="x">&#215;</span>'}</button>`;
    });
    html+='</div>';
  });
  $('main').innerHTML=html;
  $('next').classList.toggle('dim',offset===0);
}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function setVal(id,k,v){
  S.e[id]=S.e[id]||{};
  if(v>0)S.e[id][k]=v;else delete S.e[id][k];
  save();render();
}
function open(html){$('sheet').innerHTML=html;$('scrim').classList.add('on')}
function close(){$('scrim').classList.remove('on')}

function numSheet(h,k){
  const d=pd(k);
  open(`<h2>${esc(h.name)}</h2><label>${d.toDateString()}${h.unit?' ('+esc(h.unit)+')':''}</label>
  <input id="nv" type="number" inputmode="decimal" step="any" value="${val(h,k)||''}" placeholder="0">
  <div class="btns"><button class="btn" id="cancel">Cancel</button><button class="btn p" id="ok">Save</button></div>`);
  $('cancel').onclick=close;
  $('ok').onclick=()=>{setVal(h.id,k,parseFloat($('nv').value)||0);close()};
  setTimeout(()=>$('nv').focus(),50);
}

function editSheet(h){
  const isNew=!h;
  h=h||{id:'h'+Date.now(),name:'',type:'bool',unit:'',target:1,color:COLORS[S.h.length%COLORS.length],created:dk(new Date())};
  let color=h.color,stats='';
  if(!isNew){const s=streaks(h);stats=`<div class="stats"><div><b>${Math.round(score(h)*100)}%</b><small>Score</small></div><div><b>${s.cur}</b><small>Streak</small></div><div><b>${s.best}</b><small>Best</small></div><div><b>${s.total}</b><small>Days done</small></div></div>`}
  open(`<h2>${isNew?'New habit':'Edit habit'}</h2>${stats}
  <label>Name</label><input id="hn" value="${esc(h.name)}" placeholder="e.g. Read books" autocomplete="off">
  <label>Type</label><select id="ht"><option value="bool">Yes / No</option><option value="num">Measurable (number)</option></select>
  <div class="fields" id="nf"><div><label>Unit</label><input id="hu" value="${esc(h.unit)}" placeholder="pages"></div><div><label>Daily target</label><input id="hg" type="number" inputmode="decimal" value="${h.target}"></div></div>
  <label>Color</label><div class="sw" id="sw">${COLORS.map(c=>`<i data-c="${c}" style="background:${c}" class="${c===color?'sel':''}"></i>`).join('')}</div>
  <div class="btns">${isNew?'':'<button class="btn d" id="del">Delete</button>'}<button class="btn" id="cancel">Cancel</button><button class="btn p" id="ok">Save</button></div>`);
  $('ht').value=h.type;
  const tf=()=>$('nf').style.display=$('ht').value==='num'?'flex':'none';tf();$('ht').onchange=tf;
  $('sw').onclick=e=>{if(e.target.dataset.c){color=e.target.dataset.c;[...$('sw').children].forEach(i=>i.classList.toggle('sel',i.dataset.c===color))}};
  $('cancel').onclick=close;
  $('ok').onclick=()=>{
    const n=$('hn').value.trim();if(!n){$('hn').focus();return}
    Object.assign(h,{name:n,type:$('ht').value,unit:$('hu').value.trim(),target:parseFloat($('hg').value)||1,color});
    if(isNew)S.h.push(h);save();render();close();
  };
  if(!isNew)$('del').onclick=()=>{if(confirm('Delete "'+h.name+'" and all its history?')){S.h=S.h.filter(x=>x!==h);delete S.e[h.id];save();render();close()}};
}

function backupSheet(){
  open(`<h2>Backup</h2><label>Your data as text. Copy it somewhere safe, or paste a backup here and restore.</label>
  <textarea id="bk">${esc(JSON.stringify(S))}</textarea>
  <div class="btns"><button class="btn" id="cp">Copy</button><button class="btn p" id="rs">Restore from text</button></div>
  <div class="btns"><button class="btn" id="cancel">Close</button></div>`);
  $('cancel').onclick=close;
  $('cp').onclick=()=>{$('bk').select();try{navigator.clipboard.writeText($('bk').value)}catch(e){document.execCommand('copy')}$('cp').textContent='Copied'};
  $('rs').onclick=()=>{
    try{const d=JSON.parse($('bk').value);if(!d.h||!d.e)throw 0;
      if(confirm('Replace all current data with this backup?')){S=d;save();render();close()}}
    catch(e){alert('That text is not a valid backup.')}
  };
}

$('main').onclick=e=>{
  const c=e.target.closest('[data-cell]'),n=e.target.closest('[data-edit]');
  if(c){const[id,k]=c.dataset.cell.split('|'),h=S.h.find(x=>x.id===id);
    if(h.type==='num')numSheet(h,k);else setVal(id,k,done(h,k)?0:1)}
  else if(n)editSheet(S.h.find(x=>x.id===n.dataset.edit));
};
$('add').onclick=()=>editSheet();
$('more').onclick=backupSheet;
$('prev').onclick=()=>{offset++;render()};
$('next').onclick=()=>{if(offset>0){offset--;render()}};
$('scrim').onclick=e=>{if(e.target===$('scrim'))close()};
document.addEventListener('visibilitychange',()=>{if(!document.hidden)render()});

// home-screen icon, drawn at runtime so no extra files are needed
(function(){
  const c=document.createElement('canvas');c.width=c.height=180;const x=c.getContext('2d');
  x.fillStyle='#121212';x.fillRect(0,0,180,180);
  x.lineCap=x.lineJoin='round';
  x.strokeStyle='#4aa3ff';x.lineWidth=16;x.beginPath();x.arc(90,90,56,0.4,Math.PI*1.75);x.stroke();
  x.strokeStyle='#f77fa6';x.lineWidth=16;x.beginPath();x.moveTo(62,92);x.lineTo(84,114);x.lineTo(124,66);x.stroke();
  $('icon').href=c.toDataURL('image/png');
})();
render();
</script>
</body>
</html>
